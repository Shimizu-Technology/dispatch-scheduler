name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: Rails API
    # Ruby 3.3.7 has no prebuilt archive on the new ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Lint Ruby
        run: bin/rubocop -f github

      - name: Run Rails tests
        run: bin/rails test

      - name: Scan Rails security
        run: bin/brakeman --no-pager

      - name: Scan gem vulnerabilities
        run: bin/bundler-audit

  web:
    name: React Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Lint TypeScript
        run: npm run lint

      - name: Build web app
        run: npm run build

  importer:
    name: Sample Data Importer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install importer dependencies
        run: python -m pip install openpyxl

      - name: Compile importer
        run: python -m py_compile scripts/import_sample_data.py

      - name: Run importer tests
        run: python -m unittest discover -s scripts -p "*_test.py"
